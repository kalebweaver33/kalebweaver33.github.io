<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaleb J. Weaver's Krafty Weasel ✦ WEB115 ✦ FizzBuzz 1</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="stylesheet" href="styles/default.css">


<!-- Accumulus cloud script -->
<script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>


</head>

<body>


<div data-include="components/header.html"></div>

<main>
    <h2>FizzBuzz 1</h2>

    <!-- h3 used to display the JavaScript-updated welcome message -->
    <h3 id="greeting">Welcome to Krafty Weasel Web Works!</h3>

    <figure>
        <img
            src="images/Weasel-768x432.jpg"
            alt="Krafty Weasel mascot"
        >
        <figcaption>Krafty Weasel working on FizzBuzz 1.</figcaption>
    </figure>

    <!-- form used to collect the user's first name, middle initial, and last name -->
    <form id="name_form">
        <p>
            <label for="first_name">First Name:</label>
            <input
                type="text"
                id="first_name"
                name="first_name"
                placeholder="Enter your first name here"
                required
            >
        </p>

        <p>
            <label for="middle_initial">Middle Initial:</label>
            <input
                type="text"
                id="middle_initial"
                name="middle_initial"
                placeholder="Optional"
                maxlength="1"
                pattern="[A-Za-z]"
            >
        </p>

        <p>
            <label for="last_name">Last Name:</label>
            <input
                type="text"
                id="last_name"
                name="last_name"
                placeholder="Enter your last name here"
                required
            >
        </p>

        <button type="submit">Start FizzBuzz</button>
    </form>

    <section>
        <h3>Krafty Weasel FizzBuzz</h3>

        <!-- div used as a container for the JavaScript-generated FizzBuzz list -->
        <div id="loop_output"></div>
    </section>
</main>

<div data-include="components/footer.html"></div>

<script>
    // Get the form and input fields from the page.
    const nameForm = document.getElementById("name_form");
    const firstNameField = document.getElementById("first_name");
    const middleInitialField = document.getElementById("middle_initial");
    const lastNameField = document.getElementById("last_name");

    // Get the greeting and output container from the page.
    const greeting = document.getElementById("greeting");
    const loopOutput = document.getElementById("loop_output");

    // Run the following instructions when the form is submitted.
    nameForm.addEventListener("submit", function(event) {
        // Prevent the form from refreshing the page.
        event.preventDefault();

        // Get the values entered by the user.
        const firstName = firstNameField.value.trim();
        const middleInitial = middleInitialField.value.trim();
        const lastName = lastNameField.value.trim();

        // Start the full name with the first name.
        let fullName = firstName;

        // Add the middle initial and period only when one was entered.
        if (middleInitial !== "") {
            fullName += " " + middleInitial + ".";
        }

        // Add the last name.
        fullName += " " + lastName;

        // Replace the original greeting with the personalized greeting.
        greeting.textContent =
            "Welcome to Krafty Weasel Web Works, " + fullName + "!";

        // Clear the previous FizzBuzz output.
        loopOutput.innerHTML = "";

        // Generate the FizzBuzz list from 1 through 140.
        for (let iCounter = 1; iCounter <= 140; iCounter++) {
            const line = document.createElement("p");

            // Check whether the number is divisible by both 3 and 5.
            if (
                iCounter % 3 === 0 &&
                iCounter % 5 === 0
            ) {
                line.textContent =
                    iCounter + ") Weasel Krafty";
            }
            // Check whether the number is divisible by 3.
            else if (iCounter % 3 === 0) {
                line.textContent =
                    iCounter + ") Weasel";
            }
            // Check whether the number is divisible by 5.
            else if (iCounter % 5 === 0) {
                line.textContent =
                    iCounter + ") Krafty";
            }
            // Numbers not divisible by 3 or 5 use the normal theme words.
            else {
                line.textContent =
                    iCounter + ") Krafty Weasel";
            }

            // Add the generated line to the page.
            loopOutput.appendChild(line);
        }
    });
</script>

<!-- Vicunadator standards-check script -->
<script
    src="https://divonbriesen.github.io/teaching/tools/standards-check.js"
    data-mode="course"
    defer
></script>

<!-- HTMLInclude script used to load the shared header and footer -->
<script src="scripts/HTMLInclude.min.js"></script>


</body>
</html>
