<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaleb J. Weaver's Krafty Weasel ✦ WEB115 ✦ FizzBuzz 3</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="stylesheet" href="styles/default.css">
    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
</head>

<body>
    <div data-include="components/header.html"></div>


<main>
    <h2>FizzBuzz 3</h2>

    <!-- h3 used to display the JavaScript-updated welcome message -->
    <h3 id="greeting">Welcome to Krafty Weasel Web Works!</h3>

    <figure>
        <img
            src="images/Weasel-768x432.jpg"
            alt="Krafty Weasel mascot"
        >
        <figcaption>Krafty Weasel working on FizzBuzz 3.</figcaption>
    </figure>

    <!-- form used to collect the user's first name, middle initial, and last name -->
    <form id="name_form">
        <p>
            <label for="first_name">First Name:</label>
            <input
                type="text"
                id="first_name"
                name="first_name"
                placeholder="Enter your first name here"
                required
            >
        </p>

        <p>
            <label for="middle_initial">Middle Initial:</label>
            <input
                type="text"
                id="middle_initial"
                name="middle_initial"
                placeholder="Optional"
                maxlength="1"
                pattern="[A-Za-z]"
            >
        </p>

        <p>
            <label for="last_name">Last Name:</label>
            <input
                type="text"
                id="last_name"
                name="last_name"
                placeholder="Enter your last name here"
                required
            >
        </p>

        <button type="submit">Start FizzBuzz</button>
    </form>

    <section>
        <h3>Krafty Weasel FizzBuzz</h3>

        <!-- div used as a container for the JavaScript-generated FizzBuzz list -->
        <div id="loop_output"></div>
    </section>
</main>

<div data-include="components/footer.html"></div>

<script>
    // Function that checks whether one number is evenly divisible by another.
    function checkDivision(number, divisor) {
        return number % divisor === 0;
    }

    // Divisors and their corresponding FizzBuzz words.
    const divisors = [
        { number: 3, word: "Weasel" },
        { number: 5, word: "Krafty" },
        { number: 7, word: "BANG!" }
    ];

    const nameForm = document.getElementById("name_form");
    const firstNameField = document.getElementById("first_name");
    const middleInitialField = document.getElementById("middle_initial");
    const lastNameField = document.getElementById("last_name");

    const greeting = document.getElementById("greeting");
    const loopOutput = document.getElementById("loop_output");

    nameForm.addEventListener("submit", function(event) {
        event.preventDefault();

        const firstName = firstNameField.value.trim();
        const middleInitial = middleInitialField.value.trim();
        const lastName = lastNameField.value.trim();

        let fullName = firstName;

        if (middleInitial !== "") {
            fullName += " " + middleInitial + ".";
        }

        fullName += " " + lastName;

        greeting.textContent =
            "Welcome to Krafty Weasel Web Works, " + fullName + "!";

        loopOutput.innerHTML = "";

        // Generate the FizzBuzz list from 1 through 140.
        for (let iCounter = 1; iCounter <= 140; iCounter++) {
            const line = document.createElement("p");
            const results = [];

            // Check every divisor in the array.
            for (const divisor of divisors) {
                if (checkDivision(iCounter, divisor.number)) {
                    results.push(divisor.word);
                }
            }

            // If the number is not divisible by any divisor,
            // use the default Krafty Weasel message.
            if (results.length === 0) {
                line.textContent = iCounter + ") Krafty Weasel";
            } else {
                line.textContent =
                    iCounter + ") " + results.join(" ");
            }

            loopOutput.appendChild(line);
        }
    });
</script>

<script
    src="https://divonbriesen.github.io/teaching/tools/standards-check.js"
    data-mode="course"
    defer
></script>

<script src="scripts/HTMLInclude.min.js"></script>


</body>
</html>
