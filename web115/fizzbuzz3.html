<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaleb J. Weaver's Krafty Weasel ✦ WEB115 ✦ FizzBuzz 3</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="stylesheet" href="styles/default.css">
    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
</head>

<body>
    <div data-include="components/header.html"></div>


<main>
    <h2>FizzBuzz 3</h2>

    <!-- h3 used to display the JavaScript-updated welcome message -->
    <h3 id="greeting">Welcome to Krafty Weasel Web Works!</h3>

    <figure>
        <img
            src="images/Weasel-768x432.jpg"
            alt="Krafty Weasel mascot"
        >
        <figcaption>Krafty Weasel working on FizzBuzz 3.</figcaption>
    </figure>

    <!-- form used to collect the user's first name, middle initial, and last name -->
    <form id="name_form">
        <p>
            <label for="first_name">First Name:</label>
            <input
                type="text"
                id="first_name"
                name="first_name"
                placeholder="Enter your first name here"
                required
            >
        </p>

        <p>
            <label for="middle_initial">Middle Initial:</label>
            <input
                type="text"
                id="middle_initial"
                name="middle_initial"
                placeholder="Optional"
                maxlength="1"
                pattern="[A-Za-z]"
            >
        </p>

        <p>
            <label for="last_name">Last Name:</label>
            <input
                type="text"
                id="last_name"
                name="last_name"
                placeholder="Enter your last name here"
                required
            >
        </p>

        <button type="submit">Start FizzBuzz</button>
        <button type="reset">Reset</button>
    </form>

    <section>
        <h3>Krafty Weasel FizzBuzz</h3>

        <!-- div used as a container for the JavaScript-generated FizzBuzz list -->
        <div id="loop_output"></div>
    </section>
</main>

<div data-include="components/footer.html"></div>

<script src="scripts/fizzbuzz3.js"></script>

<script
    src="https://divonbriesen.github.io/teaching/tools/standards-check.js"
    data-mode="course"
    defer
></script>

<script src="scripts/HTMLInclude.min.js"></script>


</body>
</html>
