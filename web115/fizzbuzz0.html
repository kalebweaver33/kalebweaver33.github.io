<div data-include="components/header.html"></div>

<main>
    <h2>FizzBuzz 0</h2>

    <h3 id="greeting">Welcome to Krafty Weasel Web Works!</h3>

    <form id="name_form">
        <p>
            <label for="first_name">First Name:</label>
            <input
                type="text"
                id="first_name"
                name="first_name"
                placeholder="Enter your first name here"
                required
            >
        </p>

        <p>
            <label for="middle_initial">Middle Initial:</label>
            <input
                type="text"
                id="middle_initial"
                name="middle_initial"
                placeholder="Optional"
                maxlength="1"
                pattern="[A-Za-z]"
            >
        </p>

        <p>
            <label for="last_name">Last Name:</label>
            <input
                type="text"
                id="last_name"
                name="last_name"
                placeholder="Enter your last name here"
                required
            >
        </p>

        <button type="submit">Submit</button>
    </form>

    <section>
        <h3>Part I: Krafty Weasel Loop</h3>
        <div id="loop_output"></div>
    </section>

    <section>
        <h3>Part II: Even or Odd</h3>
        <div id="parity_output"></div>
    </section>
</main>

<div data-include="components/footer.html"></div>

<script>
    const nameForm = document.getElementById("name_form");
    const firstNameField = document.getElementById("first_name");
    const middleInitialField = document.getElementById("middle_initial");
    const lastNameField = document.getElementById("last_name");
    const greeting = document.getElementById("greeting");
    const loopOutput = document.getElementById("loop_output");
    const parityOutput = document.getElementById("parity_output");

    nameForm.addEventListener("submit", function(event) {
        event.preventDefault();

        const firstName = firstNameField.value.trim();
        const middleInitial = middleInitialField.value.trim();
        const lastName = lastNameField.value.trim();

        let fullName = firstName;

        if (middleInitial !== "") {
            fullName += " " + middleInitial + ".";
        }

        fullName += " " + lastName;

        greeting.textContent = "Welcome to Krafty Weasel Web Works, " + fullName + "!";

        loopOutput.innerHTML = "";

        for (let iCounter = 1; iCounter <= 125; iCounter++) {
            const line = document.createElement("p");
            line.textContent = iCounter + ") Krafty Weasel";
            loopOutput.appendChild(line);
        }

        const countInput = prompt(
            "How high do you want to count, " + firstName + "?"
        );

        let count = Number(countInput);

        if (!Number.isInteger(count) || count < 1) {
            count = 10;
        }

        parityOutput.innerHTML = "";

        for (let iCounter = 1; iCounter <= count; iCounter++) {
            const line = document.createElement("p");

            if (iCounter % 2 === 0) {
                line.textContent = iCounter + ") Krafty Weasel - the number is even";
            } else {
                line.textContent = iCounter + ") Krafty Weasel - the number is odd";
            }

            parityOutput.appendChild(line);
        }
    });
</script>

<!-- Validation -->
<script src="https://divonbriesen.github.io/teaching/tools/standards-check.js" data-mode="course" defer></script>

<script src="scripts/HTMLInclude.min.js"></script>
